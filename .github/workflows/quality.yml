name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Expo SDK dependencies
        run: npx expo install --check

      - name: Lint application
        run: npm run lint

      - name: Check client types
        run: npm run typecheck

      - name: Check backend types
        run: npm run backend:check

      - name: Check architecture boundaries
        run: npm run backend:architecture

      - name: Run contract suites
        run: npm run test:contracts

      - name: Run end-to-end API smoke test
        run: npm run backend:test

      - name: Export static web application
        run: npm run web:export

      - name: Upload verified web export
        uses: actions/upload-artifact@v4
        with:
          name: konjo-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
