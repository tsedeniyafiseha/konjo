<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konjo — Enter phone number</title>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#9CAF88"/><text x="100" y="115" font-family="serif" font-size="48" fill="#fff" text-anchor="middle">K</text></svg></template>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDEAE2;font-family:'Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box}
a{text-decoration:none;color:#586851}
input{font-family:'Plus Jakarta Sans',sans-serif;outline:none}
#otpSection{display:none}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 24px;background:#EDEAE2">
<div style="width:412px;height:892px;border-radius:40px;overflow:hidden;box-shadow:0 20px 60px -10px rgba(0,0,0,0.3);background:#FAF9F5">
<div style="padding:8px 20px 32px">
  <div style="display:flex;align-items:center;gap:12px;padding:10px 0 28px">
    <a href="./role-select.html" style="width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #E6E8E2;display:flex;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#212822" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </div>
  <div style="font-family:'Bodoni Moda',serif;font-size:27px;color:#212822;font-weight:500">Enter your phone number</div>
  <div style="font-size:13.5px;color:#5F665C;margin-top:8px;line-height:1.5">We'll text you a one-time verification code to confirm it's you.</div>
  <div style="display:flex;align-items:center;gap:10px;margin-top:28px;background:#fff;border:1px solid #E6E8E2;border-radius:6px;padding:14px 16px">
    <span style="font-size:15px;color:#212822;font-weight:600">+251</span>
    <div style="width:1px;height:20px;background:#E6E8E2"></div>
    <input placeholder="9 12 345 678" style="border:none;flex:1;font-size:15px;color:#212822;background:transparent"/>
  </div>
  <div onclick="document.getElementById('otpSection').style.display='block'" style="margin-top:20px;background:#9CAF88;color:#fff;text-align:center;padding:16px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer">Send code</div>
  <div id="otpSection" style="margin-top:36px">
    <div style="font-size:13px;color:#5F665C;margin-bottom:14px">Enter the 4-digit code we sent you</div>
    <div style="display:flex;gap:12px">
      <div style="width:56px;height:60px;border:1.5px solid #9CAF88;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#212822;background:#fff">2</div>
      <div style="width:56px;height:60px;border:1.5px solid #9CAF88;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#212822;background:#fff">4</div>
      <div style="width:56px;height:60px;border:1.5px solid #9CAF88;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#212822;background:#fff">7</div>
      <div style="width:56px;height:60px;border:1.5px solid #9CAF88;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#212822;background:#fff">1</div>
    </div>
    <div style="font-size:12.5px;color:#9DA399;margin-top:14px">Didn't get a code? <a href="#">Resend</a></div>
    <div style="margin-top:22px;background:#212822;color:#fff;text-align:center;padding:16px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer">Verify &amp; continue</div>
  </div>
</div>
</div>
</div>
</body>
</html>
