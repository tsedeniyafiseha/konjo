project_id = "konjo-client"

# Enable phone identities and require the SMS OTP before Supabase issues a
# session. Delivery is replaced by the signed Send SMS hook below.
[auth.sms]
enable_signup = true
enable_confirmations = true

# The hosted Send SMS Hook is enabled in the Supabase dashboard and points to
# /functions/v1/send-sms. Its signing secret intentionally stays in the hosted
# Auth configuration and Edge Function secret store rather than in this file,
# so unrelated function deployments never need the secret locally.

[functions.send-sms]
verify_jwt = false

# This function owns authentication per route because the API intentionally
# contains public catalogue/readiness routes and signed provider webhooks in
# addition to endpoints protected by a Supabase user access token.
[functions.api]
verify_jwt = false
